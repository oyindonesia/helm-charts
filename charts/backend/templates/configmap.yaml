{{- if .Values.appConfigMap.create -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-configmap" (include "payservice.fullname" .)) .Values.appConfigMap.name }}
  labels:
    {{- include "payservice.labels" . | nindent 4 }}
    {{- with .Values.appConfigMap.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.appConfigMap.extraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- with .Values.appConfigMap.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
